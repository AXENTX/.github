    <path d="M5 25 Q22 8, 40 25 T70 25" stroke="url(#blueGradient)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M5 42 Q22 25, 40 42 T70 42" stroke="url(#accentGradient)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M5 59 Q22 42, 40 59 T70 59" stroke="url(#blueGradient)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.4"/>
